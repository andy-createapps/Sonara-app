name: Build Sonara APK

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK licenses
      # The build machine already has the Android SDK; this only records the license
      # acceptance so Gradle may download any extra pieces it needs.
      run: |
        sudo mkdir -p "$ANDROID_HOME/licenses"
        printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' | sudo tee "$ANDROID_HOME/licenses/android-sdk-license" > /dev/null
        printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' | sudo tee "$ANDROID_HOME/licenses/android-sdk-preview-license" > /dev/null
        echo "ANDROID_HOME=$ANDROID_HOME"

    - name: Fetch the two large model files from the original project
      # Unchanged files from BitChord (GPLv3), left out of the upload to keep it small.
      run: |
        for f in beat_this_final0_q8.onnx vocals_umxhq_int8.onnx; do
          curl -fL --retry 3 -o "app/src/main/assets/$f" \
            "https://raw.githubusercontent.com/kushagrasinghx/BitChord/main/app/src/main/assets/$f"
        done
        ls -l app/src/main/assets/*.onnx

    - name: Signing key
      # Uses your own key if you add KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      # as repository secrets. If not, a fresh key is made for this build. A build signed with a
      # different key can't be installed over an older one (uninstall first), so add the secrets
      # once you are happy and keep the same key from then on.
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ] && [ -f signing/sonara-key.b64 ]; then
          # The fixed Sonara key kept in the repo: every build is signed the same way,
          # which is what lets the in-app updater install new versions over old ones.
          KEYSTORE_BASE64="$(cat signing/sonara-key.b64)"
          KEYSTORE_PASSWORD="$(cat signing/sonara-key.pass)"; KEY_ALIAS="sonara"; KEY_PASSWORD="$KEYSTORE_PASSWORD"
        fi
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > sonara-release.jks
          STORE_PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; KEY_PASS="$KEY_PASSWORD"
        else
          STORE_PASS="sonara-temp-pass"; ALIAS="sonara"; KEY_PASS="sonara-temp-pass"
          keytool -genkeypair -v -keystore sonara-release.jks -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Sonara"
        fi
        {
          echo "storeFile=sonara-release.jks"
          echo "storePassword=$STORE_PASS"
          echo "keyAlias=$ALIAS"
          echo "keyPassword=$KEY_PASS"
        } > keystore.properties
        touch local.properties

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Sonara
      run: ./gradlew assembleProdRelease -PsonaraBuild=${{ github.run_number }}

    - name: Collect the APK
      run: |
        mkdir -p out
        cp app/build/outputs/apk/prod/release/*universal*.apk out/Sonara.apk 2>/dev/null \
          || cp "$(ls app/build/outputs/apk/prod/release/*.apk | head -n 1)" out/Sonara.apk

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: sonara-apks
        path: out/*.apk

    - name: Publish release (the in-app updater reads this)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Sonara 1.0.${{ github.run_number }}
        files: out/*.apk
