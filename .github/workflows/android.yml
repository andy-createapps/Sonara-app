name: Build Sonara APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Fetch the two large model files from the original project
      # Unchanged files from BitChord (GPLv3), left out of the upload to keep it small.
      run: |
        for f in beat_this_final0_q8.onnx vocals_umxhq_int8.onnx; do
          curl -fL --retry 3 -o "app/src/main/assets/$f" \
            "https://raw.githubusercontent.com/kushagrasinghx/BitChord/main/app/src/main/assets/$f"
        done
        ls -l app/src/main/assets/*.onnx

    - name: Signing key
      # Uses your own key if you add KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      # as repository secrets. If not, a fresh key is made for this build. A build signed with a
      # different key can't be installed over an older one (uninstall first), so add the secrets
      # once you are happy and keep the same key from then on.
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > sonara-release.jks
          STORE_PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; KEY_PASS="$KEY_PASSWORD"
        else
          STORE_PASS="sonara-temp-pass"; ALIAS="sonara"; KEY_PASS="sonara-temp-pass"
          keytool -genkeypair -v -keystore sonara-release.jks -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Sonara"
        fi
        {
          echo "storeFile=sonara-release.jks"
          echo "storePassword=$STORE_PASS"
          echo "keyAlias=$ALIAS"
          echo "keyPassword=$KEY_PASS"
        } > keystore.properties
        touch local.properties

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Andy's version
      run: ./gradlew assembleProdRelease -Pedition=andy

    - name: Collect Andy's APK
      run: |
        mkdir -p out
        cp app/build/outputs/apk/prod/release/*universal*.apk out/Sonara-Andy.apk 2>/dev/null \
          || cp "$(ls app/build/outputs/apk/prod/release/*.apk | head -n 1)" out/Sonara-Andy.apk

    - name: Build Camellia's version
      run: ./gradlew assembleProdRelease -Pedition=camellia

    - name: Collect Camellia's APK
      run: |
        cp app/build/outputs/apk/prod/release/*universal*.apk out/Sonara-Camellia.apk 2>/dev/null \
          || cp "$(ls app/build/outputs/apk/prod/release/*.apk | head -n 1)" out/Sonara-Camellia.apk

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: sonara-apks
        path: out/*.apk
